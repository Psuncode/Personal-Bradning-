name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/blog-system-v2

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Excludes the four CLAUDE.md "Known carve-outs (don't try to fix these)"
      # test files — home/about/case-studies/current-focus assert against old
      # chrome that was refactored and are explicitly out of scope.
      - name: Test (vitest run-once)
        run: npm run test -- --run --exclude '**/{home,about,case-studies,current-focus}.test.tsx'

      # Build-time-required env vars (src/lib/env.ts BUILD_TIME_REQUIRED tier).
      # These are placeholders that satisfy the requireBuildEnv presence + length
      # checks so the page-data-collection pass completes for /admin and
      # /api/checkout. They are NEVER deployed — real secrets live in Vercel
      # project settings per environment (Preview / Production).
      - name: Build
        env:
          SESSION_SECRET: ci_placeholder_at_least_32_chars_long_xxxxxxxxxxxx
          NEXT_PUBLIC_PHOTOGRAPHY_URL: https://photography.philipsun.com
        run: npm run build
